- name: Deploy Gitea with Docker
  hosts: gitea
  become: true
  tasks:
    - name: Instalar Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Crear carpeta de datos de Gitea
      file:
        path: "{{ gitea_data_path }}"
        state: directory
        mode: "0755"

    - name: Detener contenedor Gitea si existe
      shell: docker rm -f gitea 2>/dev/null || true
      args:
        warn: false

    - name: Desplegar contenedor Gitea
      shell: |
        docker run -d --name gitea \
          --restart unless-stopped \
          -p {{ gitea_port }}:3000 \
          -e GITEA__server__DOMAIN="{{ gitea_domain }}" \
          -e GITEA__security__ADMIN_USER="{{ gitea_admin_user }}" \
          -e GITEA__security__ADMIN_PASSWORD="{{ gitea_admin_password }}" \
          -v {{ gitea_data_path }}:/data \
          gitea/gitea:latest
      args:
        warn: false

