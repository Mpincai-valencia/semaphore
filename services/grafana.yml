---
- name: Deploy Grafana con Docker
  hosts: grafana
  become: true

  tasks:
    - name: Instalar Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Crear carpeta de datos de Grafana
      file:
        path: "{{ grafana_data_path }}"
        state: directory
        mode: "0755"

    - name: Detener contenedor Grafana si existe
      shell: docker rm -f grafana 2>/dev/null || true
      args:
        warn: false

    - name: Desplegar contenedor Grafana
      shell: |
        docker run -d --name grafana \
          --restart unless-stopped \
          -p {{ grafana_port }}:3000 \
          -e GF_SERVER_DOMAIN="{{ grafana_domain }}" \
          -e GF_SECURITY_ADMIN_USER="{{ GRAFANA_ADMIN_USER }}" \
          -e GF_SECURITY_ADMIN_PASSWORD="{{ GRAFANA_ADMIN_PASSWORD }}" \
          -v {{ grafana_data_path }}:/var/lib/grafana \
          grafana/grafana:latest
      args:
        warn: false



