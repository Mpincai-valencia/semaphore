---
- name: Mantenimiento automático de Guacamole
  hosts: guacamole
  become: yes
  tasks:

    - name: Actualizar lista de paquetes
      apt:
        update_cache: yes

    - name: Actualizar todos los paquetes del sistema
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Reiniciar servicio de Tomcat (Guacamole)
      service:
        name: tomcat9
        state: restarted
      ignore_errors: yes

    - name: Reiniciar servicio MySQL (si existe)
      service:
        name: mysql
        state: restarted
      ignore_errors: yes

    - name: Verificar estado de Tomcat
      command: systemctl is-active tomcat9
      register: tomcat_status
      ignore_errors: yes

    - name: Mostrar estado de Tomcat en salida
      debug:
        msg: "Estado de Tomcat: {{ tomcat_status.stdout }}"

    - name: Crear carpeta de backups si no existe
      file:
        path: /opt/guacamole_backups
        state: directory
        mode: '0755'

    - name: Respaldar archivo de configuración de Guacamole
      copy:
        src: /etc/guacamole/guacamole.properties
        dest: /opt/guacamole_backups/guacamole.properties_{{ ansible_date_time.date }}
        remote_src: yes

    - name: Respaldar base de datos de Guacamole (si usa MySQL)
      command: mysqldump -u root -p'your_password' guacamole_db > /opt/guacamole_backups/guacamole_db_{{ ansible_date_time.date }}.sql
      ignore_errors: yes

    - name: Limpiar logs antiguos (más de 7 días)
      find:
        paths: /var/log
        age: 7d
        patterns: "*.log"
      register: old_logs

    - name: Eliminar logs antiguos
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files }}"
      when: old_logs.matched > 0
