---
- name: Instalar Docker CE y desplegar Guacamole
  hosts: guacamole
  become: true

  vars:
    guac_network: guacnet
    guac_db_name: guacdb
    guac_db_user: guacuser
    guac_db_pass: guacpass
    guac_port: 8080
    guac_data_path: /opt/guacamole/data

  tasks:
    - name: Eliminar posibles paquetes conflictivos
      apt:
        name:
          - docker.io
          - containerd
          - containerd.io
          - runc
        state: absent
      ignore_errors: yes

    - name: Instalar dependencias necesarias
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Agregar clave GPG oficial de Docker
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        warn: false

    - name: Agregar repositorio oficial de Docker (para Debian)
      shell: |
        echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/debian \
        $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        warn: false

    - name: Actualizar e instalar Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Crear carpeta de datos de Guacamole
      file:
        path: "{{ guac_data_path }}"
        state: directory
        mode: "0755"

    - name: Crear red Docker
      shell: docker network create {{ guac_network }} 2>/dev/null || true
      args:
        warn: false

    - name: Desplegar contenedor MySQL para Guacamole
      shell: |
        docker run -d --name guacdb \
          --restart unless-stopped \
          --network {{ guac_network }} \
          -e MYSQL_ROOT_PASSWORD={{ guac_db_pass }} \
          -e MYSQL_DATABASE={{ guac_db_name }} \
          -e MYSQL_USER={{ guac_db_user }} \
          -e MYSQL_PASSWORD={{ guac_db_pass }} \
          -v {{ guac_data_path }}/mysql:/var/lib/mysql \
          mysql:8.0
      args:
        warn: false

    - name: Esperar 20 segundos para que la base de datos inicialice
      pause:
        seconds: 20

    - name: Desplegar contenedor Guacamole
      shell: |
        docker run -d --name guacamole \
          --restart unless-stopped \
          --network {{ guac_network }} \
          -p {{ guac_port }}:8080 \
          -e MYSQL_HOST=guacdb \
          -e MYSQL_DATABASE={{ guac_db_name }} \
          -e MYSQL_USER={{ guac_db_user }} \
          -e MYSQL_PASSWORD={{ guac_db_pass }} \
          guacamole/guacamole:latest
      args:
        warn: false
