---
- name: Mantenimiento automático de Uptime Kuma
  hosts: uptimekuma
  become: yes
  tasks:

    - name: Actualizar lista de paquetes
      apt:
        update_cache: yes

    - name: Actualizar todos los paquetes del sistema
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Reiniciar servicio de Uptime Kuma (si existe)
      service:
        name: uptime-kuma
        state: restarted
      ignore_errors: yes

    - name: Verificar si el proceso de Uptime Kuma está activo
      command: systemctl is-active uptime-kuma
      register: kuma_status
      ignore_errors: yes

    - name: Mostrar estado de Uptime Kuma
      debug:
        msg: "Estado del servicio: {{ kuma_status.stdout | default('no encontrado') }}"

    - name: Crear carpeta de backups si no existe
      file:
        path: /opt/uptimekuma_backups
        state: directory
        mode: '0755'

    - name: Respaldar base de datos o configuración (si existe)
      shell: |
        if [ -f /opt/uptime-kuma/data/kuma.db ]; then
          cp /opt/uptime-kuma/data/kuma.db /opt/uptimekuma_backups/kuma_{{ ansible_date_time.date }}.db
        fi
      args:
        warn: false
      ignore_errors: yes

    - name: Limpiar logs antiguos (más de 7 días)
      find:
        paths: /var/log
        age: 7d
        patterns: "*.log"
      register: old_logs

    - name: Eliminar logs antiguos
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files }}"
      when: old_logs.matched > 0

