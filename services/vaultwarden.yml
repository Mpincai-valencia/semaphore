---
- name: Mantenimiento automático de Vaultwarden
  hosts: vaultwarden
  become: yes
  vars:
    vaultwarden_dir: /opt/vaultwarden
    vaultwarden_backup_dir: /opt/vaultwarden_backups

  tasks:

    - name: Actualizar lista de paquetes
      apt:
        update_cache: yes

    - name: Actualizar todos los paquetes del sistema
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Reiniciar servicio de Vaultwarden (si existe)
      service:
        name: vaultwarden
        state: restarted
      ignore_errors: yes

    - name: Verificar si el proceso de Vaultwarden está activo
      command: systemctl is-active vaultwarden
      register: vaultwarden_status
      ignore_errors: yes

    - name: Mostrar estado de Vaultwarden
      debug:
        msg: "Estado del servicio: {{ vaultwarden_status.stdout | default('no encontrado') }}"

    - name: Crear carpeta de backups si no existe
      file:
        path: "{{ vaultwarden_backup_dir }}"
        state: directory
        mode: '0755'

    - name: Respaldar base de datos y configuración (si existen)
      shell: |
        if [ -f {{ vaultwarden_dir }}/data/db.sqlite3 ]; then
          cp {{ vaultwarden_dir }}/data/db.sqlite3 {{ vaultwarden_backup_dir }}/vaultwarden_db_{{ ansible_date_time.date }}.sqlite3
        fi
        if [ -f {{ vaultwarden_dir }}/data/config.json ]; then
          cp {{ vaultwarden_dir }}/data/config.json {{ vaultwarden_backup_dir }}/config_{{ ansible_date_time.date }}.json
        fi
      args:
        warn: false
      ignore_errors: yes

    - name: Limpiar logs antiguos (más de 7 días)
      find:
        paths: /var/log
        age: 7d
        patterns: "*.log"
      register: old_logs

    - name: Eliminar logs antiguos
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files }}"
      when: old_logs.matched > 0

    - name: Mostrar dominio y puerto de Vaultwarden
      debug:
        msg: "Vaultwarden está configurado en http://{{ vaultwarden_domain }}:{{ vaultwarden_port }}"

    - name: Mostrar usuario administrador configurado
      debug:
        msg: "Administrador: {{ vaultwarden_admin_user }}"

